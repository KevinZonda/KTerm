<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>KTerm</title>
  </head>
  <body>
    <div id="app">
      <aside id="workspace-peek" aria-label="Workspace switcher" aria-hidden="true">
        <nav id="workspace-peek-list" aria-label="Workspace shortcuts"></nav>
      </aside>
      <aside id="workspace-sidebar" aria-label="Workspaces" aria-hidden="true">
        <header class="workspace-sidebar-header">
          <span>Workspaces</span>
          <button id="new-workspace" type="button" title="New workspace (Alt+N)" aria-label="New workspace">+</button>
        </header>
        <nav id="workspace-list" aria-label="Workspace list"></nav>
      </aside>
      <main id="workspace"></main>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
